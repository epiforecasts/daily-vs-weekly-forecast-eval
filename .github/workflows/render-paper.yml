name: Render Paper

on:
  push:
    branches:
      - main
    paths:
      - 'paper/**'
      # The manuscript quotes its result numbers from this summary, so a
      # regenerated summary changes the rendered paper.
      - 'local/output/paper_summary.rds'
      - '.github/workflows/render-paper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'paper/**'
      - 'local/output/paper_summary.rds'
  workflow_dispatch:

jobs:
  render-paper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'

      - name: Install TinyTeX
        run: quarto install tinytex

      # paper.qmd reads local/output/paper_summary.rds for the values quoted in
      # the Results and Discussion, so the render needs R. The summary is a
      # plain list of base R types, so knitr is the only package required --
      # no renv restore and no EpiNow2.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installed directly rather than via setup-r-dependencies, which would
      # try to resolve the renv.lock in the repository root and pull in the
      # whole forecasting stack.
      - name: Install knitr
        run: install.packages("knitr")
        shell: Rscript {0}

      - name: Render paper
        run: |
          cd paper
          quarto render paper.qmd

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
          retention-days: 30

      - name: Commit rendered PDF (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add paper/paper.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-render paper [skip ci]" && git push)
